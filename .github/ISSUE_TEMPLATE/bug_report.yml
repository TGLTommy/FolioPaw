name: 缺陷报告
description: 使用合成数据或允许再分发的数据报告可复现的问题。
title: "[缺陷]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿包含 API Key、数据库、凭据、受版权保护的书籍或私人文本。
  - type: textarea
    id: description
    attributes:
      label: 问题现象
      description: 请说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现步骤；需要测试数据时请使用合成数据。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统和 Node.js 版本
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除所有密钥、个人数据和不可再分发的书籍内容。
          required: true
